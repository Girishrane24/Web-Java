<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Admin Page</title>
<link rel="stylesheet" href="/Assignment1/src/main/webapp/resourses/css/style.css">

<style>

body{
    font-family: Arial;
    background: linear-gradient(to right, #dfe9f3, #ffffff);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

form{
    background-color: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0px 0px 15px rgba(0,0,0,0.2);
    width: 400px;
}

h2{
    text-align: center;
    color: #333;
    margin-bottom: 15px;
}

table{
    width: 100%;
    border-collapse: collapse;
}

td{
    padding: 10px;
    font-size: 16px;
}

input[type="text"]{
    width: 100%;
    padding: 8px;
    border: 1px solid #999;
    border-radius: 5px;
    font-size: 14px;
    box-sizing: border-box;
}

input[type="text"]:focus{
    border-color: #007bff;
    outline: none;
    box-shadow: 0px 0px 5px rgba(0,123,255,0.5);
}

input[type="submit"]{
    width: 100%;
    padding: 10px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

input[type="submit"]:hover{
    background-color: #0056b7;
}

</style>


</head>

<body>

<form action="serv2" method="post">

<h2>This form is for Admin</h2>
<h2>Enter Student Marks</h2>

<table border="1">

<tr>
    <td>PRN Number :</td>
    <td>
        <input type="text" name="studprn">
    </td>
</tr>

<tr>
    <td>Name :</td>
    <td>
        <input type="text" name="studname">
    </td>
</tr>

<tr>
    <td>Subject 1 :</td>
    <td>
        <input type="text" name="sub1">
    </td>
</tr>

<tr>
    <td>Subject 2 :</td>
    <td>
        <input type="text" name="sub2">
    </td>
</tr>

<tr>
    <td>Subject 3 :</td>
    <td>
        <input type="text" name="sub3">
    </td>
</tr>

<tr>
    <td>Subject 4 :</td>
    <td>
        <input type="text" name="sub4">
    </td>
</tr>

<tr>
    <td>Subject 5 :</td>
    <td>
        <input type="text" name="sub5">
    </td>
</tr>

<tr>
	<td></td>
    <td colspan="2">
        <input type="submit" value="Submit">
    </td>
</tr>

</table>

</form>

</body>
</html>
