<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Login Form</title>
</head>

<body>

<h2>Login Form</h2>

<form action="MyServlet" method="post">

    <table border="1">
    
        <tr>
            <td>Username :</td>
            <td><input type="text" name="uname"></td>
        </tr>
        
        <tr>
            <td>Password :</td>
            <td><input type="password" name="pass"></td>
        </tr>
        
        <tr>
            <td colspan="2" align="center">
                <input type="submit" value="Login">
            </td>
        </tr>
        
    </table>

</form>

</body>
</html>
