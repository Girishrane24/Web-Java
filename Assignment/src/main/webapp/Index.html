<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Student Result</title>

<style>

body{
	font-family: Arial, sans-serif;
	background: #f0f4f8;
	display: flex;
	justify-content: center;
	align-items: center;
	height: 100vh;
	margin: 0;
}

.container{
	background: white;
	padding: 30px;
	border-radius: 10px;
	box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
	width: 350px;
	text-align: center;
}

h2{
	color: #333;
	margin-bottom: 20px;
}

table{
	width: 100%;
	border-collapse: collapse;
}

td{
	padding: 10px;
}

input[type="text"]{
	width: 95%;
	padding: 8px;
	border: 1px solid #ccc;
	border-radius: 5px;
	font-size: 14px;
}

input[type="submit"]{
	background: #007bff;
	color: white;
	border: none;
	padding: 10px 20px;
	border-radius: 5px;
	cursor: pointer;
	font-size: 15px;
}

input[type="submit"]:hover{
	background: #0056b3;
}

a{
	text-decoration: none;
	color: #007bff;
	font-weight: bold;
}

a:hover{
	color: #0056b3;
}

.admin{
	margin-top: 15px;
}

</style>

</head>

<body>

<div class="container">

<h2>Student Result Portal</h2>

<form action="serv1" method="post">

<table>

<tr>
<td>Enter PRN Number</td>
<td><input type="text" name="prn"></td>
</tr>

<tr>
<td></td>
<td><input type="submit" value="Show Result"></td>
</tr>

</table>

</form>

<div class="admin">
	Admin ? <a href="Admin.html">Click Here</a>
</div>

</div>

</body>
</html>
